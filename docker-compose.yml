services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/logging_monitoring
      INGEST_API_KEY: ${INGEST_API_KEY:-change-me-before-use}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    depends_on:
      - mongo
volumes:
  mongo_data:
